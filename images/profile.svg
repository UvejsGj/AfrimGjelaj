<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
  <title id="title">Portrait placeholder</title>
  <desc id="desc">Replace images/profile.jpg with a professional photo; this SVG is the default asset.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a7b"/>
      <stop offset="100%" style="stop-color:#1a3a4f"/>
    </linearGradient>
  </defs>
  <rect width="560" height="700" fill="url(#bg)"/>
  <text x="280" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="rgba(255,255,255,0.92)">AG</text>
  <text x="280" y="620" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.55)">560×700 · JPG recommended</text>
</svg>
